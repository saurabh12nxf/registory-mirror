linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (*github.com/spf13/pflag.FlagSet).GetInt
      - (*github.com/spf13/pflag.FlagSet).GetBool
      - (*github.com/spf13/pflag.FlagSet).GetString
      - (io).ReadAll
      - (path/filepath).Rel
      - (*github.com/saurabh12nxf/registry-mirror/internal/mirror.Tracker).TrackSyncError
      - (*github.com/saurabh12nxf/registry-mirror/internal/mirror.Tracker).TrackSyncComplete
      - (*github.com/saurabh12nxf/registry-mirror/internal/storage.DB).logPolicyAction
      - (*github.com/saurabh12nxf/registry-mirror/internal/security.Verifier).VerifyImage
  govet:
    disable:
      - fieldalignment
      - shadow
  misspell:
    locale: US

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - gofmt
    - misspell

issues:
  exclude-rules:
    # Exclude linters from test files
    - path: _test\.go
      linters:
        - errcheck
        - staticcheck
        - govet
    
    # Exclude specific staticcheck warnings
    - linters:
        - staticcheck
      text: "SA5011"
    
    - linters:
        - staticcheck
      text: "SA4031"
    
    - linters:
        - staticcheck
      text: "SA9003"
    
    # Exclude nil checks
    - linters:
        - govet
      text: "nilness"

  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
